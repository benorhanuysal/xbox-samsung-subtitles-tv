  <div id="yardim" class="gizli">
    <b>KIRMIZI</b> ayarlar &nbsp;

    <b>MAVI</b> HDMI degistir &nbsp;
    <b>YUKARI/ASAGI</b> altyazi konumu &nbsp;

  </div>
